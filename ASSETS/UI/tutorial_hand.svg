<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Hand silhouette with pointing index finger -->
  <g filter="url(#shadow)">
    <!-- Main glove/hand outline -->
    <path d="M 52 38 
             C 52 30, 60 30, 60 38 
             L 60 62 
             C 60 58, 68 58, 68 62 
             L 68 64 
             C 68 60, 76 60, 76 64 
             L 76 67 
             C 76 63, 84 63, 84 68 
             L 84 84 
             C 84 100, 72 108, 56 108 
             C 44 108, 36 100, 36 88 
             L 36 78 
             C 32 76, 28 70, 32 64 
             C 36 58, 44 64, 48 70 
             L 52 70 
             Z" 
          fill="#FFFFFF" 
          stroke="#1E293B" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
    <!-- Inner shading/accent -->
    <path d="M 52 42 L 52 74" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 64 L 60 76" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 68 66 L 68 76" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Touch pulse indicator dot at tip -->
  <circle cx="56" cy="34" r="8" fill="#38BDF8" opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
</svg>
